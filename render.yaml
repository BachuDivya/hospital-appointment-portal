services:
  - type: web
    name: hospital-appointment-portal-demo
    runtime: python
    rootDir: .
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_data && gunicorn hospital_portal.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WEB_CONCURRENCY
        value: 2
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"